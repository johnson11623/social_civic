version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
sql:
  - engine: postgresql
    schema: db/migrations
    queries: [db/queries/identity.sql, db/queries/erasure.sql]
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
        emit_interface: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/boundary.sql
    gen:
      go:
        package: boundarydb
        out: internal/boundary/boundarydb
        sql_package: pgx/v5
        emit_interface: true
