version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
sql:
  - engine: postgresql
    schema: db/migrations
    queries: [db/queries/identity.sql, db/queries/erasure.sql]
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
        emit_interface: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/boundary.sql
    gen:
      go:
        package: boundarydb
        out: internal/boundary/boundarydb
        sql_package: pgx/v5
        emit_interface: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/post.sql
    gen:
      go:
        package: postdb
        out: internal/post/postdb
        sql_package: pgx/v5
        emit_interface: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/membership.sql
    gen:
      go:
        package: membershipdb
        out: internal/membership/membershipdb
        sql_package: pgx/v5
        emit_interface: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/moderation.sql
    gen:
      go:
        package: moderationdb
        out: internal/moderation/moderationdb
        sql_package: pgx/v5
        emit_interface: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/media.sql
    gen:
      go:
        package: mediadb
        out: internal/media/mediadb
        sql_package: pgx/v5
        emit_interface: true
